; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[platformio]
default_envs = supermini

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
;
; Reproducible-release build metadata policy (Phase 12 final):
;   The Arduino framework compiles every firmware translation unit with -ggdb,
;   which embeds the absolute build worktree path into DWARF debug metadata
;   (DW_AT_comp_dir in .debug_str and an absolute directory entry in
;   .debug_line). Those bytes are the ONLY thing that differs when the SAME
;   commit/toolchain is built from two worktrees with different absolute paths,
;   so they make firmware.elf non-reproducible; esptool then embeds the ELF's
;   SHA-256 into the app image descriptor (firmware.bin 0xB0-0xCF), which
;   cascades to the image checksum + validation hash, breaking the exact raw
;   firmware.bin / firmware-merged.bin policy anchors.
;
;   `-fdebug-prefix-map` / `-ffile-prefix-map` were tested but are unreliable on
;   Windows/MinGW here: GCC records DW_AT_comp_dir with the getcwd() spelling
;   (upper-case drive, backslashes) yet canonicalises other absolute paths to a
;   different spelling (lower-cased drive AND lower-cased path components, e.g.
;   LovyanGFX -> lovyangfx), so a single prefix-map never covers every spelling
;   and any missed variant silently breaks reproducibility. We therefore strip
;   DWARF from the firmware release envs with build_unflags=-ggdb + -g0. This is
;   safe: the binary proofs read the ELF SYMBOL TABLE (nm .symtab) and loadable
;   image strings, NOT DWARF, so all worker/diag/heap symbol and logging-string
;   proofs are retained; -g0 only removes .debug_* sections. The loadable image
;   (code/data) is byte-identical to the -ggdb build -- only the embedded ELF
;   SHA (and its dependent checksum/hash) change -- so runtime behaviour and the
;   exact RAM/flash/firmware.bin/merged sizes are preserved. build_unflags and
;   the -g0 flag propagate to every supermini-* env via extends +
;   ${env:supermini.build_flags}; the native* test envs are separate and keep
;   their debug info. Framework runtime diagnostics also embed __FILE__ strings;
;   scripts/build-release.ps1 therefore binds PLATFORMIO_CORE_DIR to the
;   policy-pinned D:\pio-core so those loadable strings are runner-independent.
build_unflags = -ggdb
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -g0

lib_deps =
  lovyan03/LovyanGFX@1.2.25
  bblanchon/ArduinoJson@7.4.3

; Optional ADS-B network worker firmware: identical to [env:supermini] but with
; the worker adapter (src/services/adsb_worker.cpp) compiled in via
; PLANE_RADAR_ADSB_WORKER=1. The default [env:supermini] never defines the macro,
; so it resolves to 0 (see include/services/adsb_worker.h) and stays synchronous
; and worker-free: no worker task, queues, or 8 KB worker stack are linked.
[env:supermini-worker]
extends = env:supermini
build_flags =
  ${env:supermini.build_flags}
  -DPLANE_RADAR_ADSB_WORKER=1

; Quiet build: identical to supermini but with all Serial logging compiled out
; (LOG_LEVEL=0). No Serial.begin, no output. Useful to verify the radio/display
; logic compiles and links without any Serial dependency.
[env:supermini-quiet]
extends = env:supermini
build_flags =
  ${env:supermini.build_flags}
  -DPLANE_RADAR_LOG_LEVEL=0

; Diagnostics build: supermini with performance metrics enabled
; (PLANE_RADAR_DIAGNOSTICS=1). Adds fetch timing, render/runway timing, heap
; snapshot, and worker HWM output. Default LOG_LEVEL (2, INFO) is preserved.
; No PLANE_RADAR_ADSB_WORKER: diagnostics are independent of the worker option.
[env:supermini-diag]
extends = env:supermini
build_flags =
  ${env:supermini.build_flags}
  -DPLANE_RADAR_DIAGNOSTICS=1

; Worker + diagnostics: supermini-worker with performance metrics enabled.
[env:supermini-worker-diag]
extends = env:supermini-worker
build_flags =
  ${env:supermini-worker.build_flags}
  -DPLANE_RADAR_DIAGNOSTICS=1

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter =
  -<*>
  +<core/>
  +<data/large_airports_data.cpp>
  +<services/adsb_arena.cpp>
  +<services/adsb_object_decoder.cpp>
  +<services/adsb_stream_parser.cpp>
  +<services/adsb_http.cpp>
  +<services/adsb_fetch.cpp>
  +<services/adsb_snapshot_store.cpp>
build_flags =
  -std=gnu++17
  -DPLANE_RADAR_NATIVE_TEST_ACCESS=1
lib_deps =
  throwtheswitch/Unity@2.6.1
  bblanchon/ArduinoJson@7.4.3
; Exclude the diagnostics-on contract suite (it requires PLANE_RADAR_DIAGNOSTICS=1
; and will fail under the default macro value of 0) and the headless render suite
; (test_native_gfx needs LovyanGFX + the native-gfx shims wired only in
; [env:native-gfx]; it must never build under the pure-logic [env:native]).
test_ignore =
  test_runtime_diagnostics_on
  test_native_gfx

; Diagnostics-on native test environment: same source filter as native but with
; PLANE_RADAR_DIAGNOSTICS=1 so the conditional WorkerResult field and the
; diagnostics constants can be verified at compile+run time.
; Filters to ONLY the diagnostics-enabled contract suite so default-off tests
; (which expect DIAGNOSTICS=0) are not run with the opposite macro value.
[env:native-diag]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -DPLANE_RADAR_DIAGNOSTICS=1
test_filter = test_runtime_diagnostics_on
test_ignore =

; Phase 12: headless LovyanGFX render + golden-image gate. Fully local/offline;
; NO SDL2, NO window, NO hardware. Compiles the ACTUAL production UI drawing code
; (ui/radar_display.cpp, ui/runway_overlay.cpp, ui/status_screens.cpp) plus the
; pure core/data modules into a native binary, renders each named scene into an
; in-RAM 240x240 RGB565 LovyanGFX sprite canvas, and byte-compares the captured
; framebuffer against checked-in golden BMPs (see test/test_native_gfx +
; test/golden). Headless-only shims are selected here and NOWHERE else:
;   -iquote test/native_gfx_support shadows hardware/lgfx_config.hpp (a sprite
;     canvas standing in for the GC9A01 device) and driver/gpio.h (config.h types).
;   -I test/native_gfx_support exposes the fake <opencv2/opencv.hpp> whose only
;     job is to make LovyanGFX 1.2.25 pick its self-contained, panel-free "opencv"
;     desktop backend (millis/heap via std::chrono/malloc) with no SDL dependency.
; The firmware display.cpp/display_font.cpp are filtered out and replaced by
; headless equivalents in the test suite that load the exact data/ui_font.vlw bytes
; from disk. LOG_LEVEL=0 compiles the lone Serial log macro in the UI to a no-op.
[env:native-gfx]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter =
  -<*>
  +<core/>
  +<data/large_airports_data.cpp>
  +<ui/radar_display.cpp>
  +<ui/runway_overlay.cpp>
  +<ui/status_screens.cpp>
build_flags =
  -std=gnu++17
  -DPLANE_RADAR_LOG_LEVEL=0
  -iquote test/native_gfx_support
  -Itest/native_gfx_support
lib_deps =
  throwtheswitch/Unity@2.6.1
  bblanchon/ArduinoJson@7.4.3
  lovyan03/LovyanGFX@1.2.25
test_filter = test_native_gfx
test_ignore =
