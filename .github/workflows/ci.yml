name: Certified Firmware CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: certified-firmware-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  certify:
    name: Certified firmware
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          check-latest: false

      - name: Install pinned build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
          .\scripts\setup-native-toolchain.ps1

      - name: Isolate certification checkout
        shell: pwsh
        run: |
          git switch --force-create ci-pull-request $env:GITHUB_SHA
          git remote remove origin
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty.Count -ne 0) {
            throw "Certification checkout is dirty:`n$($dirty -join "`n")"
          }

      - name: Build and verify certified firmware
        shell: pwsh
        run: |
          .\scripts\build-release.ps1
          .\scripts\verify-release.ps1 -Path "release\$env:GITHUB_SHA"
